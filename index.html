<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>quentin six.</title>
  <style>
    @font-face {
      font-family: 'LowerResolution';
      src: url('LowerResolution-period.ttf') format('truetype');
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100vw;
      background: #000;
      color: #fff;
      font-family: 'LowerResolution', system-ui, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ---- Full-screen video background ---- */
    .bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      z-index: 0;
    }
    /* Dark scrim so the bouncing wordmark stays legible over the busy art. */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.38);
      z-index: 1;
      pointer-events: none;
    }

    /* ---- DVD-bounce wordmark ---- */
    .brand-bounce {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      font-family: 'LowerResolution', system-ui, sans-serif;
      font-size: clamp(2.2rem, 11vw, 8rem);
      line-height: 1;
      white-space: nowrap;
      color: #fff5c4;
      text-shadow:
         3px  3px 0 rgba(0, 0, 0, 0.95),
        -3px  3px 0 rgba(0, 0, 0, 0.85),
         3px -3px 0 rgba(0, 0, 0, 0.78),
        -3px -3px 0 rgba(0, 0, 0, 0.95),
         0    4px 0 rgba(0, 0, 0, 0.9),
         0   -4px 0 rgba(0, 0, 0, 0.75),
         4px  0   0 rgba(0, 0, 0, 0.7),
        -4px  0   0 rgba(0, 0, 0, 0.85),
         0 0 22px rgba(0, 0, 0, 0.5);
      filter: blur(0.55px) contrast(1.05);
      letter-spacing: 0.01em;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      opacity: 0;
      transition: opacity 1.4s steps(10);
      z-index: 60;
    }
    body.brand-bounce-ready .brand-bounce { opacity: 1; }
  </style>
</head>
<body>

  <img class="bg" src="giphy.gif" alt="">
  <div class="scrim"></div>

  <div class="brand-bounce">quentin six.</div>

  <script>
    (function () {
      var brandBounce = document.querySelector('.brand-bounce');

      // Bounce params - lifted from quentinnn.com so it feels identical.
      var SPEED_X = 78;   // px/sec
      var SPEED_Y = 57;   // px/sec
      var DVD_COLORS = [
        '#ff4d4d', '#ff9933', '#ffea00',
        '#4dff7a', '#4de0ff', '#b366ff', '#ff66d4'
      ];
      var dvdColorIdx = 0;
      function nextBounceColor() {
        dvdColorIdx = (dvdColorIdx + 1) % DVD_COLORS.length;
        brandBounce.style.color = DVD_COLORS[dvdColorIdx];
      }

      var bx = 0, by = 0;
      var bdx = SPEED_X, bdy = SPEED_Y;
      var lastFrameMs = 0;

      function placeBounceStart() {
        var bw = brandBounce.offsetWidth, bh = brandBounce.offsetHeight;
        bx = Math.max(0, (window.innerWidth  - bw) / 2);
        by = Math.max(0, (window.innerHeight - bh) * 0.34);
        brandBounce.style.transform = 'translate3d(' + bx + 'px, ' + by + 'px, 0)';
      }

      function bounceTick(nowMs) {
        var dt = lastFrameMs ? Math.min((nowMs - lastFrameMs) / 1000, 0.05) : 0;
        lastFrameMs = nowMs;
        var bw = brandBounce.offsetWidth, bh = brandBounce.offsetHeight;
        var maxX = Math.max(0, window.innerWidth  - bw);
        var maxY = Math.max(0, window.innerHeight - bh);
        bx += bdx * dt;
        by += bdy * dt;
        if (bx <= 0)    { bx = 0;    bdx = Math.abs(bdx);  nextBounceColor(); }
        if (bx >= maxX) { bx = maxX; bdx = -Math.abs(bdx); nextBounceColor(); }
        if (by <= 0)    { by = 0;    bdy = Math.abs(bdy);  nextBounceColor(); }
        if (by >= maxY) { by = maxY; bdy = -Math.abs(bdy); nextBounceColor(); }
        brandBounce.style.transform = 'translate3d(' + bx + 'px, ' + by + 'px, 0)';
        requestAnimationFrame(bounceTick);
      }

      function startBounce() {
        placeBounceStart();
        brandBounce.style.color = DVD_COLORS[dvdColorIdx];
        lastFrameMs = 0;
        requestAnimationFrame(bounceTick);
      }

      window.addEventListener('resize', function () {
        var bw = brandBounce.offsetWidth, bh = brandBounce.offsetHeight;
        bx = Math.min(bx, Math.max(0, window.innerWidth  - bw));
        by = Math.min(by, Math.max(0, window.innerHeight - bh));
      });

      function reveal() {
        document.body.classList.add('brand-bounce-ready');
        startBounce();
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(reveal);
        setTimeout(reveal, 1500); // safety net
      } else {
        window.addEventListener('load', reveal);
      }
    })();
  </script>

</body>
</html>
